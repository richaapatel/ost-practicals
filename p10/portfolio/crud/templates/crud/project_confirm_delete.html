{% extends 'crud/base.html' %}
{% block title %}Delete Project{% endblock %}
{% block content %}
<section>
    <h2>Delete Project</h2>
    <p>Are you sure you want to remove "<strong>{{ project.title }}</strong>" from your portfolio?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-delete">Yes, Delete</button>
        <a href="{% url 'project_list' %}" class="btn btn-cancel">Cancel</a>
    </form>
</section>
{% endblock %}
